function csvDownload(){let g=S.goal,rows=[CSVHEAD,...S.sources.flatMap(s=>[g.base,g.report].map(y=>{let r=record(s,y);return[s.id,s.name,s.level,s.type,y,r.value??'',r.quality,r.method]}))],blob=new Blob([rows.map(r=>r.map(csvEsc).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='portshift-inventory-template.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Inventory template exported')}
function csvParse(text){text=text.replace(/^\uFEFF/,'');let rows=[],row=[],cell='',quoted=false,after=false;const push=()=>{row.push(cell);cell='';after=false};for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else{quoted=false;after=true}}else cell+=c;continue}if(c==='"'&&!cell&&!after){quoted=true;continue}if(c===','){push();continue}if(c==='\r'||c==='\n'){if(c==='\r'&&text[i+1]==='\n')i++;push();rows.push(row);row=[];continue}if(after&&c.trim())throw Error('Invalid character after a quoted cell.');if(c==='"')throw Error('Unexpected quotation mark.');cell+=c}if(quoted)throw Error('Unclosed quoted CSV field.');if(cell||row.length||after){push();rows.push(row)}return rows.filter(r=>r.some(c=>c.trim()!==''))}
function validateImport(text){const rows=csvParse(text);if(!rows.length)throw Error('The file is empty.');const headers=rows[0].map(c=>c.trim().toLowerCase());if(headers.length!==CSVHEAD.length||CSVHEAD.some(h=>!headers.includes(h))||new Set(headers).size!==headers.length)throw Error('Use the exported template columns: '+CSVHEAD.join(', '));if(rows.length===1)throw Error('The file has no data rows.');if(rows.length>2001)throw Error('Prototype limit: 2,000 rows per import.');let staged=clone(S.sources),g=S.goal,seen=new Set(),updated=0,added=0;for(let i=1;i<rows.length;i++){let r=rows[i],at=h=>String(r[headers.indexOf(h)]??'').trim(),fail=t=>{throw Error('Row '+(i+1)+': '+t)};if(r.length!==headers.length)fail('Unexpected column count.');let sid=at('source_id'),name=at('source_name'),level=at('tier').toUpperCase(),type=at('source_type'),y=Number(at('year')),value=at('tonnes_co2e')===''?null:Number(at('tonnes_co2e')),quality=at('provenance'),method=at('method');if(!name||!LEVELS.includes(level)||!Object.hasOwn(TYPES,type)||![g.base,g.report].includes(y)||!valueOk(value)||!['Reported','Estimated'].includes(quality))fail('Check source name, tier, source type, selected years, non-negative emissions and provenance (Reported or Estimated).');if(sid&&!/^[A-Za-z0-9_-]{1,100}$/.test(sid))fail('Invalid source ID.');let s=sid?staged.find(x=>x.id===sid):staged.find(x=>x.level===level&&x.name.toLowerCase()===name.toLowerCase());if(!s){if(staged.some(x=>x.level===level&&x.name.toLowerCase()===name.toLowerCase()))fail('Duplicate source name in this tier. Use its existing ID.');s={id:sid||id(),name,level,type,records:{}};staged.push(s);added++}else if(s.name!==name||s.level!==level||s.type!==type)fail('Source metadata differs from the existing record. Edit the source in the tool before importing.');let key=s.id+'|'+y;if(seen.has(key))fail('Duplicate source/year record.');seen.add(key);s.records[y]=rec(value,quality,method);updated++}return{staged,updated,added}}
function importModal(){modal('Import existing inventory',`<p class="muted small">Import calculated annual CO₂e totals using the template.</p><div class="subtle"><p><strong>Selected years:</strong> ${S.goal.base} and ${S.goal.report}</p><p class="note">Use existing source IDs; leave IDs blank for new sources. Blank values are unknown. Unmatched records are retained.</p></div><div class="row" style="margin-top:16px">${btn('Download CSV template','export')}${btn('Choose CSV file','choosefile','','primary')}</div><div id="import-result"></div>`)}
let pendingImport=null;$('#csv-file').addEventListener('change',async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>1500000)throw Error('The prototype accepts files up to 1.5 MB.');pendingImport=validateImport(await f.text());const p=pendingImport;modal('Confirm inventory import',`<div class="callout"><div><strong>${p.updated} year records · ${p.added} new sources</strong><p>Existing matching records will be replaced. Other records are retained. Coverage will need to be reviewed again.</p></div></div><p class="note">The file passed structural checks, not verification of its emissions methods.</p>`,()=>{S.sources=p.staged;reviewReset();pendingImport=null;commit('Inventory imported')},{submitLabel:'Import records'})}catch(err){pendingImport=null;modal('CSV could not be imported',`<p class="muted">${esc(err.message)}</p><p>No inventory records were changed.</p>`,null,{extra:btn('Try another file','choosefile','','primary')})}});
function summaryModal(){const g=S.goal,k=calc(),q=dataQuality(g.report),q0=dataQuality(g.base),all=S.plan,approved=all.filter(approvedPlan),done=all.filter(p=>p.status==='Complete');let cell=(s,y)=>valid(val(s,y))?`${fmt(val(s,y),2)} <span class="muted mini">${record(s,y).quality==='Estimated'?'(est.)':'(rep.)'}</span>`:'Missing';modal('Director summary',`<div class="sheet"><div class="row between"><span class="eyebrow">PortShift</span><span class="small muted">${S.demo?'Fictional example':'Port self-report'} · ${g.report}</span></div><h1>${esc(S.profile.name)}</h1><p class="sub">${g.report} CO₂ management review · ${esc(scopeShort())}</p><div class="goalbanner" style="margin-top:14px">${esc(goalText())}</div><div class="kpis">${kpi('Reporting subtotal',q.known?fmt(totals(g.report),2)+' <small>t CO₂e</small>':'—',complete(g.report)?'Listed sources':'Partial inventory')}${kpi('Outcome status',esc(k.status),k.change!==null?`${fmt(Math.abs(k.change),1)}% ${k.change>=0?'reduction':'increase'} against baseline`:esc(k.reason))}${kpi('Delivery',`${done.length} <small>of ${approved.length}</small>`,'Agreed actions complete')}</div><h2>Inventory (tonnes CO₂e)</h2><div class="scroll"><table><thead><tr><th>Source</th><th>Tier</th><th class="num">${g.base}</th><th class="num">${g.report}</th></tr></thead><tbody>${sources().map(s=>`<tr><td>${esc(s.name)}</td><td>${s.level}</td><td class="num">${cell(s,g.base)}</td><td class="num">${cell(s,g.report)}</td></tr>`).join('')||'<tr><td colspan="4">No listed sources.</td></tr>'}</tbody></table></div><p class="note">${q0.missing+q.missing} missing year entries. ${q.estimated} reporting-year figures estimated; ${q.reported} reported. Coverage ${S.coverage.reviewed?'reviewed by the port':'not reviewed'}. ${esc(S.coverage.note)}</p>${selectedGoal()&&k.t!==null?`<p class="note">Calculated target: ${mfmt(k.t)} ${esc(unit())}${!S.coverage.reviewed?' (provisional; coverage not reviewed)':''}.</p>`:''}<h2>Implementation and engagement</h2>${S.goals.length?`<table><thead><tr><th>Indicator</th><th>Current</th><th>Target</th></tr></thead><tbody>${S.goals.map(x=>`<tr><td>${esc(x.name)}</td><td>${goalValues(x).current===null?'Not entered':fmt(goalValues(x).current,2)+' '+esc(x.unit)}</td><td>${fmt(x.target,2)} ${esc(x.unit)} · ${x.year}</td></tr>`).join('')}</tbody></table>`:'<p class="note">No additional goals.</p>'}<h2>Action plan</h2>${all.length?`<table><thead><tr><th>Action / investigation</th><th>Owner & milestone</th><th>Status</th></tr></thead><tbody>${all.map(p=>`<tr><td>${esc(p.name)}<div class="mini muted">${esc(p.next||'Next step not set')}${planBoundary(p)?' · '+esc(planBoundary(p)):''}</div></td><td>${esc(p.owner||'Not assigned')}<div class="mini muted">${esc(p.due||'Not set')}</div></td><td>${esc(p.status)}</td></tr>`).join('')}</tbody></table>`:'<p class="note">No plan items.</p>'}<h2>Accountability</h2><p class="small">Responsible: ${esc(g.owner||'Not assigned')}<br>Director review: ${g.approved?esc(g.director)+' · '+esc(g.date):'Pending'}</p><p class="note">Not independently verified. The selected inventory is not necessarily a complete corporate or port-wide carbon footprint. Action completion does not establish an emissions saving.</p></div>`,null,{wide:true,extra:btn('Print / save PDF','print','','primary')})}
function confirmModal(title,message,callback,label='Confirm'){modal(title,`<p>${esc(message)}</p>`,()=>{callback();commit('Updated')},{submitLabel:label})}
document.addEventListener('submit',e=>{if(e.target.id!=='modal-form')return;e.preventDefault();if(submitHandler){const f=new FormData(e.target);try{submitHandler(f)}catch(err){console.error(err);error('Unable to save: '+err.message)}}});dialog.addEventListener('close',()=>{submitHandler=null});
document.addEventListener('click',e=>{const b=e.target.closest('[data-do]');if(!b)return;const a=b.dataset.do,k=b.dataset.id;switch(a){case'tab':closeModal();S.tab=k;render();window.scrollTo({top:0,behavior:'instant'});break;case'profile':profileModal();break;case'goal':goalModal();break;case'review':approvalModal();break;case'activity':activityModal();break;case'addgoal':milestoneModal();break;case'editgoal':milestoneModal(k);break;case'deletegoal':confirmModal('Remove goal?','This removes its tracked figures and target from the plan.',()=>{S.goals=S.goals.filter(x=>x.id!==k);approvalReset()},'Remove goal');break;case'addsource':sourceModal();break;case'source':sourceModal(k);break;case'deletesource':confirmModal('Remove source?','This deletes its figures for all years. Any related plan items remain, and coverage must be reviewed again.',()=>{S.sources=S.sources.filter(x=>x.id!==k);reviewReset()},'Remove source');break;case'coverage':coverageModal();break;case'excluded':excludedModal();break;case'togglelib':allOpportunities=!allOpportunities;render();break;case'opportunity':actionModal(null,k);break;case'custom':actionModal();break;case'editaction':actionModal(k);break;case'deleteaction':confirmModal('Remove plan item?','The item will no longer be tracked in the plan.',()=>{S.plan=S.plan.filter(p=>p.id!==k)},'Remove item');break;case'import':importModal();break;case'export':csvDownload();break;case'choosefile':$('#csv-file').click();break;case'summary':summaryModal();break;case'print':window.print();break;case'close':closeModal();break;case'reset':confirmModal('Reset fictional example?','This replaces all local changes with the illustrative demo data.',()=>{S=demo();allOpportunities=false},'Reset example');break;case'blank':confirmModal('Start a new port?','This replaces the current local workspace with a blank inventory. Export any figures you want to keep first.',()=>{S=blank();allOpportunities=false},'Start new port');break}});
render();
</script>
