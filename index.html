function csvParse(text){text=text.replace(/^\uFEFF/,'');let rows=[],row=[],cell='',quoted=false,after=false;const push=()=>{row.push(cell);cell='';after=false};for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else{quoted=false;after=true}}else cell+=c;continue}if(c==='"'&&!cell&&!after){quoted=true;continue}if(c===','){push();continue}if(c==='\r'||c==='\n'){if(c==='\r'&&text[i+1]==='\n')i++;push();rows.push(row);row=[];continue}if(after&&c.trim())throw Error('Invalid character after a quoted cell.');if(c==='"')throw Error('Unexpected quotation mark.');cell+=c}if(quoted)throw Error('Unclosed quoted CSV field.');if(cell||row.length||after){push();rows.push(row)}return rows.filter(r=>r.some(c=>c.trim()!==''))}
function validateImport(text){const rows=csvParse(text);if(!rows.length)throw Error('The file is empty.');const headers=rows[0].map(c=>c.trim().toLowerCase());if(CSVBASE.some(h=>!headers.includes(h))||headers.some(h=>!CSVHEAD.includes(h))||new Set(headers).size!==headers.length)throw Error('Use the exported template columns. The eight original columns remain supported.');if(rows.length===1)throw Error('The file has no data rows.');if(rows.length>2001)throw Error('Prototype limit: 2,000 rows per import.');let staged=clone(S.sources),g=S.goal,seen=new Set(),updated=0,added=0;for(let i=1;i<rows.length;i++){let r=rows[i],at=h=>String(r[headers.indexOf(h)]??'').trim(),fail=t=>{throw Error('Row '+(i+1)+': '+t)};if(r.length!==headers.length)fail('Unexpected column count.');let sid=at('source_id'),name=at('source_name'),level=at('tier').toUpperCase(),type=at('source_type'),y=Number(at('year')),value=at('tonnes_co2e')===''?null:Number(at('tonnes_co2e')),quality=at('provenance'),method=at('method'),owner=at('owner'),scope=at('ghg_scope')||'Not classified',evidence=at('evidence_quality')||'Not assessed';if(!name||!LEVELS.includes(level)||!Object.hasOwn(TYPES,type)||![g.base,g.report].includes(y)||!valueOk(value)||!['Reported','Estimated'].includes(quality)||!SCOPES.includes(scope)||!EVIDENCE.includes(evidence))fail('Check source, tier, type, years, emissions, provenance, scope and evidence quality.');if(evidence==='Inventory-supporting'&&!method)fail('Inventory-supporting evidence needs a method/source note.');if(level!=='A'&&['Scope 1','Scope 2'].includes(scope))fail('Scope 1 or 2 should be classified under own operations.');if(sid&&!/^[A-Za-z0-9_-]{1,100}$/.test(sid))fail('Invalid source ID.');let s=sid?staged.find(x=>x.id===sid):staged.find(x=>x.level===level&&x.name.toLowerCase()===name.toLowerCase());if(!s){if(staged.some(x=>x.level===level&&x.name.toLowerCase()===name.toLowerCase()))fail('Duplicate source name in this tier. Use its existing ID.');s={id:sid||id(),name,level,type,owner,scope,records:{}};staged.push(s);added++}else if(s.name!==name||s.level!==level||s.type!==type)fail('Source metadata differs from the existing record. Edit the source in the tool before importing.');if(headers.includes('owner')&&s.owner&&owner!==s.owner)fail('Owner differs from the existing record. Edit the source first.');if(headers.includes('ghg_scope')&&s.scope&&scope!==s.scope)fail('Scope differs from the existing record. Edit the source first.');if(headers.includes('owner')&&!s.owner)s.owner=owner;if(headers.includes('ghg_scope')&&!s.scope)s.scope=scope;let key=s.id+'|'+y;if(seen.has(key))fail('Duplicate source/year record.');seen.add(key);s.records[y]=rec(value,quality,method,evidence);updated++}return{staged,updated,added}}
function importModal(){modal('Import existing inventory',`<p class="muted small">Import calculated annual CO₂e totals using the template. The original eight-column template is also accepted; missing evidence quality defaults to Not assessed.</p><div class="subtle"><p><strong>Selected years:</strong> ${S.goal.base} and ${S.goal.report}</p><p class="note">Use existing source IDs; leave IDs blank for new sources. Blank values are unknown. Unmatched records are retained.</p></div><div class="row" style="margin-top:16px">${btn('Download CSV template','export')}${btn('Choose CSV file','choosefile','','primary')}</div><div id="import-result"></div>`)}
let pendingImport=null;$('#csv-file').addEventListener('change',async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>1500000)throw Error('The prototype accepts files up to 1.5 MB.');pendingImport=validateImport(await f.text());const p=pendingImport;modal('Confirm inventory import',`<div class="callout"><div><strong>${p.updated} year records · ${p.added} new sources</strong><p>Existing matching records will be replaced. Other records are retained. Coverage will need to be reviewed again.</p></div></div><p class="note">The file passed structural checks, not verification of its emissions methods.</p>`,()=>{S.sources=p.staged;reviewReset();pendingImport=null;commit('Inventory imported')},{submitLabel:'Import records'})}catch(err){pendingImport=null;modal('CSV could not be imported',`<p class="muted">${esc(err.message)}</p><p>No inventory records were changed.</p>`,null,{extra:btn('Try another file','choosefile','','primary')})}});
function summaryModal(){const g=S.goal,k=calc(),q=dataQuality(g.report),q0=dataQuality(g.base),all=S.plan,approved=all.filter(approvedPlan),done=all.filter(p=>p.status==='Complete');let cell=(s,y)=>valid(val(s,y))?`${fmt(val(s,y),2)} <span class="muted mini">${record(s,y).quality==='Estimated'?'(est.)':'(rep.)'}</span>`:'Missing';modal('Director summary',`<div class="sheet"><div class="row between"><span class="eyebrow">PortShift</span><span class="small muted">${S.demo?'Fictional example':'Port self-report'} · ${g.report}</span></div><h1>${esc(S.profile.name)}</h1><p class="sub">${g.report} CO₂ management review · ${esc(scopeShort())}</p><div class="goalbanner" style="margin-top:14px">${esc(goalText())}</div><div class="kpis">${kpi('Reporting subtotal',q.known?fmt(totals(g.report),2)+' <small>t CO₂e</small>':'—',complete(g.report)?'Listed sources':'Partial inventory')}${kpi('Outcome status',esc(k.status),k.change!==null?`${fmt(Math.abs(k.change),1)}% ${k.change>=0?'reduction':'increase'} against baseline`:esc(k.reason))}${kpi('Delivery',`${done.length} <small>of ${approved.length}</small>`,'Agreed actions complete')}</div><h2>Inventory (tonnes CO₂e)</h2><div class="scroll"><table><thead><tr><th>Source</th><th>Tier</th><th class="num">${g.base}</th><th class="num">${g.report}</th></tr></thead><tbody>${sources().map(s=>`<tr><td>${esc(s.name)}</td><td>${s.level}</td><td class="num">${cell(s,g.base)}</td><td class="num">${cell(s,g.report)}</td></tr>`).join('')||'<tr><td colspan="4">No listed sources.</td></tr>'}</tbody></table></div><p class="note">${q0.missing+q.missing} missing year entries; ${q0.screening+q.screening} screening or unassessed entries. ${q.estimated} reporting-year figures estimated; ${q.reported} reported. Coverage ${S.coverage.reviewed?'reviewed by the port':'not reviewed'}. ${esc(S.coverage.note)}</p>${selectedGoal()&&k.t!==null?`<p class="note">Calculated target: ${mfmt(k.t)} ${esc(unit())}${!S.coverage.reviewed?' (provisional; coverage not reviewed)':''}.</p>`:''}<h2>Implementation and engagement</h2>${S.goals.length?`<table><thead><tr><th>Indicator</th><th>Current</th><th>Target</th></tr></thead><tbody>${S.goals.map(x=>`<tr><td>${esc(x.name)}</td><td>${goalValues(x).current===null?'Not entered':fmt(goalValues(x).current,2)+' '+esc(x.unit)}</td><td>${fmt(x.target,2)} ${esc(x.unit)} · ${x.year}</td></tr>`).join('')}</tbody></table>`:'<p class="note">No additional goals.</p>'}<h2>Action plan</h2>${all.length?`<table><thead><tr><th>Action / investigation</th><th>Owner & milestone</th><th>Status</th></tr></thead><tbody>${all.map(p=>`<tr><td>${esc(p.name)}<div class="mini muted">${esc(p.next||'Next step not set')}${planBoundary(p)?' · '+esc(planBoundary(p)):''}</div></td><td>${esc(p.owner||'Not assigned')}<div class="mini muted">${esc(p.due||'Not set')}</div></td><td>${esc(p.status)}</td></tr>`).join('')}</tbody></table>`:'<p class="note">No plan items.</p>'}<h2>Action-level review</h2>${all.filter(p=>p.projectState&&p.projectState!=='Not assessed').map(p=>`<p class="small"><strong>${esc(p.name)}</strong> — ${esc(p.projectState)}; ${esc(p.observed||'No result recorded')}. ${esc(p.projectEvidence||'')}</p>`).join('')||'<p class="note">No project-level results recorded.</p>'}<p class="note">Action outcomes are separate from the organisational or selected operational inventory.</p><h2>Advisory follow-up</h2><p class="small">${esc(S.support?.next||'No advisory follow-up recorded')} · ${esc(S.support?.owner||'Not assigned')}</p><h2>Accountability</h2><p class="small">Responsible: ${esc(g.owner||'Not assigned')}<br>Director review: ${g.approved?esc(g.director)+' · '+esc(g.date):'Pending'}</p><p class="note">Not independently verified. The selected inventory is not necessarily a complete corporate or port-wide carbon footprint. Action completion does not establish an emissions saving.</p></div>`,null,{wide:true,extra:btn('Print / save PDF','print','','primary')})}

function opportunitiesCard(){const ranked=LIB.map(l=>({l,r:screen(l),p:S.plan.find(p=>p.lib===l.id)})).sort((a,b)=>Number(!!b.p)-Number(!!a.p)||(a.p&&b.p?S.plan.indexOf(a.p)-S.plan.indexOf(b.p):0));const eligible=ranked.filter(x=>x.p||x.r.show),items=allOpportunities?ranked:eligible.slice(0,3);return `<section class="card" id="opportunity-list"><div class="row between start"><div><h2 style="margin:0">Opportunities to investigate</h2><p class="note" style="margin:3px 0 0">Screened using your port profile and emissions sources.</p></div>${btn(allOpportunities?'Show fewer':'Show all opportunities','togglelib')}</div><div style="margin-top:9px">${items.length?items.map(({l,r,p})=>`<div class="opportunity-row" data-opportunity-id="${esc(l.id)}"><div><h3>${esc(p?.name||l.name)}</h3><div>${tag(p?(approvedPlan(p)?'In action plan':'In assessment'):r.label,p?'blue':r.tone)} ${tag(l.effort)}</div><p class="hint">${esc(p&&approvedPlan(p)?'Feasibility recorded; manage delivery in the action plan.':r.checks[0]||r.context[0]||l.why)}</p></div>${p?btn('View assessment','selectmeasure',`data-id="${esc(p.id)}"`):btn('Assess opportunity','opportunity',`data-id="${esc(l.id)}"`)}</div>`).join(''):'<p class="empty">No suggested measures yet. Add inventory sources or a custom measure.</p>'}</div>${!allOpportunities&&eligible.length>items.length?`<p class="note">${eligible.length-items.length} more relevant opportunities. Use Show all opportunities to explore the full library.</p>`:''}</section>`}
function investigation(p){return p.status==='Assessing'&&['Investigate','Progress now'].includes(p.priority)&&!!(p.decision&&p.owner&&p.due&&p.next)}
function planCard(){const P=S.plan||[],investigations=P.filter(investigation),delivery=P.filter(p=>['Agreed','In progress'].includes(p.status)),closed=P.filter(p=>['Complete','On hold'].includes(p.status));const row=p=>`<div class="planline" data-plan-id="${esc(p.id)}"><div><h3>${esc(p.name)}</h3>${planTag(p.status)}${planBoundary(p)?` ${tag(planBoundary(p),'amber')}`:''}</div><div><span class="caption">Owner</span>${esc(p.owner||'Not assigned')}</div><div><span class="caption">Due</span>${esc(p.due||'Not set')}</div><div><span class="caption">Next step</span>${esc(p.next||'Not set')}</div>${btn('Update','editaction',`data-id="${esc(p.id)}"`)}</div>`;const group=(title,items,empty)=>`<div class="plan-group"><h3>${title} <span class="muted small">(${items.length})</span></h3>${items.length?items.map(row).join(''):`<p class="empty">${empty}</p>`}</div>`;return `<section class="card" id="plan-card"><div class="row between start"><div><h2 style="margin:0">Your action plan</h2><p class="note" style="margin:3px 0 0">Investigations are not approved implementation projects.</p></div></div>${group('Agreed investigations',investigations,'Assign an owner, date and next step in Assessment to start an investigation.')}${group('Approved implementation',delivery,'No implementation actions agreed yet.')}${closed.length?group('Completed or on hold',closed,''):''}<p class="note">Measures still awaiting a decision, or deferred without an active investigation, remain in Assessment.</p></section>`}

 {tab:'actions',label:'Compare measures',title:'Compare options before committing resources',copy:'High potential impact is not enough. Efficiency and idling measures can progress while electrification is investigated.',targets:()=>[$('#measure-comparison .scroll')]},
 {tab:'actions',label:'Feasibility',title:'Test whether a measure is achievable',copy:'Check technical fit, stakeholder agreement and funding. Electrification remains under assessment until the barriers are resolved.',targets:()=>[$('#feasibility-checks')]},
 {tab:'actions',label:'EcoSLC support',title:'Bring in expert support where needed',copy:'EcoSLC helps the port work through the grid and terminal constraints. Advice is recorded against this specific decision.',targets:()=>[$('#action-advice')]},
 {tab:'actions',label:'Action plan',title:'Turn decisions into accountable next steps',copy:'Assign an owner, deadline and next step for the investigation. Approved implementation work is managed separately.',targets:()=>[$('#action-plan [data-plan-id="crane-electrify"]')]},
 {tab:'progress',label:'Emissions progress',title:'Review progress against the port’s goal',copy:'The recorded inventory reduction is 7.6%. Track delivery separately; the reduction does not establish savings from any one action.',targets:()=>[$('#app .kpis')]},
 {tab:'progress',label:'Individual action review',title:'Check whether an individual measure actually works',copy:'No crane installation or project savings have been recorded. The tool keeps evidence of individual effects separate from overall emissions.',targets:()=>[$('#project-review [data-project-id="crane-electrify"] .context-grid')]}
];
const guide={active:false,index:0,snapshot:null,originalOpportunities:false,originalSelection:null,scrollBefore:0,transitioning:false,token:0,frame:0,delay:0};
const originalRender=render;
function guideTargets(){return GUIDE_STEPS[guide.index].targets().filter(Boolean)}
function targetBounds(){const rects=guideTargets().map(e=>e.getBoundingClientRect()).filter(r=>r.width&&r.height);if(!rects.length)return null;return {top:Math.min(...rects.map(r=>r.top)),bottom:Math.max(...rects.map(r=>r.bottom)),left:Math.min(...rects.map(r=>r.left)),right:Math.max(...rects.map(r=>r.right))}}
function viewportLimits(){return {top:$('.navwrap').getBoundingClientRect().bottom+5,bottom:$('#guide-panel').getBoundingClientRect().top-5}}
function darken(){ $('#tour-spotlight').classList.add('hidden');$('#tour-shade').classList.remove('hidden') }
function positionSpotlight(){if(!guide.active)return;if(guide.transitioning){darken();return}const spot=$('#tour-spotlight'),r=targetBounds();if(!r){darken();return}const lim=viewportLimits(),pad=6,top=Math.max(lim.top,r.top-pad),bottom=Math.min(lim.bottom,r.bottom+pad),left=Math.max(5,r.left-pad),right=Math.min(window.innerWidth-5,r.right+pad);if(bottom<=top||right<=left){darken();return}Object.assign(spot.style,{top:top+'px',left:left+'px',width:(right-left)+'px',height:(bottom-top)+'px'});$('#tour-shade').classList.add('hidden');spot.classList.remove('hidden')}
function cancelMotion(){guide.token++;clearTimeout(guide.delay);cancelAnimationFrame(guide.frame);guide.delay=0;guide.frame=0}
function fullyVisible(r){const v=viewportLimits();return r&&r.top>=v.top+3&&r.bottom<=v.bottom-3}
function finishMotion(token){if(!guide.active||token!==guide.token)return;guide.transitioning=false;positionSpotlight()}
function animateToTarget(token){if(!guide.active||token!==guide.token)return;const r=targetBounds();if(!r){finishMotion(token);return}const v=viewportLimits(),room=Math.max(40,v.bottom-v.top-22),height=r.bottom-r.top;const from=window.scrollY,max=Math.max(0,document.documentElement.scrollHeight-window.innerHeight);const desired=from+r.top-v.top-11-Math.max(0,(room-height)/2);const to=Math.max(0,Math.min(max,desired));const dist=to-from;if(Math.abs(dist)<3){finishMotion(token);return}const duration=Math.min(1400,Math.max(680,Math.abs(dist)*.55+420)),start=performance.now();const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;function move(now){if(!guide.active||token!==guide.token)return;const t=Math.min(1,(now-start)/duration);window.scrollTo({top:from+dist*ease(t),behavior:'instant'});if(t<1)guide.frame=requestAnimationFrame(move);else{window.scrollTo({top:to,behavior:'instant'});guide.frame=0;finishMotion(token)}}guide.frame=requestAnimationFrame(move)}
render=function(){originalRender();const entry=$('#demo-entry');if(guide.active){document.body.classList.add('demo-mode');entry.textContent='Exit demo';entry.dataset.guide='exit';entry.setAttribute('aria-pressed','true');renderGuide();document.querySelectorAll('#app [data-do],footer [data-do]').forEach(b=>{b.setAttribute('aria-disabled','true');b.classList.add('guide-blocked');b.setAttribute('tabindex','-1')});positionSpotlight()}else{document.body.classList.remove('demo-mode');$('#guide-panel').classList.add('hidden');$('#tour-spotlight').classList.add('hidden');$('#tour-shade').classList.add('hidden');entry.textContent='Guided demo';entry.dataset.guide='start';entry.setAttribute('aria-pressed','false');document.querySelectorAll('footer [aria-disabled]').forEach(b=>{b.removeAttribute('aria-disabled');b.classList.remove('guide-blocked');b.removeAttribute('tabindex')})}};
function renderGuide(){const step=GUIDE_STEPS[guide.index],last=guide.index===GUIDE_STEPS.length-1,panel=$('#guide-panel');panel.classList.remove('hidden');panel.innerHTML=`<div class="guide-inner"><div><div class="tour-meta"><strong>GUIDED DEMO</strong><span>Fictional port</span><span>·</span><span>${guide.index+1} of ${GUIDE_STEPS.length}</span><span class="tour-progress" aria-hidden="true">${GUIDE_STEPS.map((_,i)=>`<span class="${i===guide.index?'active':i<guide.index?'past':''}"></span>`).join('')}</span></div><div class="guide-title" role="status">${esc(step.title)}</div><p class="guide-copy">${esc(step.copy)}</p></div><div class="guide-controls"><select id="tour-step" aria-label="Choose demonstration step">${GUIDE_STEPS.map((t,i)=>`<option value="${i}" ${i===guide.index?'selected':''}>${i+1}. ${esc(t.label)}</option>`).join('')}</select><button type="button" class="btn" data-guide="prev" ${guide.index===0?'disabled':''}>Back</button><button type="button" class="btn primary" data-guide="${last?'exit':'next'}">${last?'Finish':'Next'}</button></div></div>`;$('#tour-step').addEventListener('change',e=>goGuide(Number(e.target.value)))}
function goGuide(index,initial=false){if(!guide.active)return;const next=Math.max(0,Math.min(GUIDE_STEPS.length-1,index));if(!initial&&next===guide.index)return;const step=GUIDE_STEPS[next],newPage=initial||S.tab!==step.tab;cancelMotion();const token=guide.token;closeModal();guide.index=next;guide.transitioning=true;darken();if(newPage){S.tab=step.tab;render();window.scrollTo({top:0,behavior:'instant'})}else renderGuide();if(step.stayTop){finishMotion(token);return}if(newPage&&fullyVisible(targetBounds())&&!step.pageDelay){finishMotion(token);return}const pause=newPage?(step.pageDelay??(fullyVisible(targetBounds())?0:2000)):0;if(pause>0)guide.delay=setTimeout(()=>{guide.delay=0;animateToTarget(token)},pause);else guide.frame=requestAnimationFrame(()=>animateToTarget(token))}
function startGuide(){if(guide.active)return;closeModal();guide.snapshot=clone(S);guide.originalOpportunities=allOpportunities;guide.originalSelection=selectedActionId;guide.scrollBefore=window.scrollY;guide.active=true;guide.index=0;S=demo();allOpportunities=false;selectedActionId='crane-electrify';goGuide(0,true)}
function exitGuide(){if(!guide.active)return;cancelMotion();S=guide.snapshot;allOpportunities=guide.originalOpportunities;selectedActionId=guide.originalSelection;guide.snapshot=null;guide.active=false;guide.transitioning=false;render();window.scrollTo({top:guide.scrollBefore,behavior:'instant'})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-guide]');if(b){e.preventDefault();e.stopImmediatePropagation();switch(b.dataset.guide){case'start':startGuide();break;case'exit':exitGuide();break;case'prev':goGuide(guide.index-1);break;case'next':goGuide(guide.index+1);break}return}if(guide.active){const nav=e.target.closest('#nav [data-do="tab"]');if(nav){e.preventDefault();e.stopImmediatePropagation();const i=GUIDE_STEPS.findIndex(t=>t.tab===nav.dataset.id);if(i>=0)goGuide(i);return}if(e.target.closest('#app [data-do],footer [data-do]')){e.preventDefault();e.stopImmediatePropagation()}}},true);
document.addEventListener('keydown',e=>{if(!guide.active||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='Escape'){e.preventDefault();exitGuide();return}if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowRight'&&guide.index<GUIDE_STEPS.length-1){e.preventDefault();goGuide(guide.index+1)}else if(e.key==='ArrowLeft'&&guide.index>0){e.preventDefault();goGuide(guide.index-1)}});
window.addEventListener('scroll',positionSpotlight,{passive:true});window.addEventListener('resize',()=>{if(guide.active&&!guide.transitioning)positionSpotlight()});

render();
</script>
